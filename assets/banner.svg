<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto" style="border-radius: 12px; overflow: hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#090d1a" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Styles and Animations -->
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      .bg-pulse-1 {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .bg-pulse-2 {
        animation: pulseGlow 7s ease-in-out infinite alternate;
        transform-origin: 1000px 280px;
      }
      .card-float-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .card-float-2 {
        animation: floatSlow 6s ease-in-out infinite 1s;
      }
      .flow-line {
        stroke-dasharray: 6 6;
        animation: dashFlow 2s linear infinite;
      }
      .live-dot {
        animation: blinkDot 1.8s ease-in-out infinite;
        transform-origin: center;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .body-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
      }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="380" fill="url(#bg-grad)" />

  <!-- Geometric Grid Pattern (Subtle) -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="350" y1="0" x2="350" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="850" y1="0" x2="850" y2="380" />
    <line x1="1050" y1="0" x2="1050" y2="380" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <circle class="bg-pulse-1" cx="200" cy="100" r="140" fill="#38bdf8" fill-opacity="0.15" filter="url(#glow-cyan)" />
  <circle class="bg-pulse-2" cx="1020" cy="240" r="160" fill="#818cf8" fill-opacity="0.15" filter="url(#glow-cyan)" />
  <circle cx="620" cy="50" r="100" fill="#a855f7" fill-opacity="0.08" filter="url(#glow-cyan)" />

  <!-- Visual Dynamic Flow Lines representing Reconciliation Between Entities -->
  <g fill="none">
    <path class="flow-line" d="M 820 100 C 920 100, 960 170, 1050 170" stroke="#38bdf8" stroke-width="2.5" stroke-opacity="0.6" />
    <path class="flow-line" d="M 850 290 C 940 290, 980 230, 1060 230" stroke="#34d399" stroke-width="2.5" stroke-opacity="0.6" />
    <line class="flow-line" x1="100" y1="330" x2="480" y2="330" stroke="#818cf8" stroke-width="1.8" stroke-opacity="0.4" />
  </g>

  <!-- Right Side Interactive Graphic Cards (Background Decorative Layer, kept clear of title) -->
  <g class="card-float-1" transform="translate(870, 55)" filter="url(#card-shadow)">
    <rect width="270" height="95" rx="14" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" />
    <!-- Mini badge inside card -->
    <rect x="18" y="18" width="32" height="32" rx="8" fill="#0284c7" fill-opacity="0.3" />
    <text x="34" y="39" font-size="16" text-anchor="middle" fill="#38bdf8">⚖️</text>
    <text class="title-text" x="62" y="32" font-size="13" fill="#f8fafc">Multi-Entity Netting</text>
    <text class="body-text" x="62" y="47" font-size="11" fill="#94a3b8">Bilateral &amp; Multilateral</text>
    <rect x="18" y="62" width="234" height="18" rx="6" fill="#0f172a" />
    <rect x="18" y="62" width="195" height="18" rx="6" fill="url(#accent-cyan)" fill-opacity="0.25" />
    <text class="body-text" x="25" y="75" font-size="9.5" fill="#38bdf8" font-weight="bold">MATCHED: $48.2M (99.8%)</text>
  </g>

  <g class="card-float-2" transform="translate(850, 185)" filter="url(#card-shadow)">
    <rect width="290" height="105" rx="14" fill="url(#card-grad)" stroke="#10b981" stroke-opacity="0.35" stroke-width="1.5" />
    <rect x="18" y="18" width="32" height="32" rx="8" fill="#059669" fill-opacity="0.3" />
    <text x="34" y="39" font-size="16" text-anchor="middle" fill="#34d399">⚡</text>
    <text class="title-text" x="62" y="32" font-size="13" fill="#f8fafc">Continuous Close Engine</text>
    <text class="body-text" x="62" y="47" font-size="11" fill="#94a3b8">Cross-Ledger Elimination</text>
    <g transform="translate(18, 65)">
      <rect width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle class="live-dot" cx="28" cy="12" r="4" fill="#10b981" />
      <text class="body-text" x="40" y="16" font-size="10" fill="#e2e8f0">Subledger A</text>
      
      <text x="140" y="17" font-size="12" fill="#64748b" text-anchor="middle">⇄</text>

      <rect x="155" y="0" width="115" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle class="live-dot" cx="165" cy="12" r="4" fill="#38bdf8" />
      <text class="body-text" x="177" y="16" font-size="10" fill="#e2e8f0">Subledger B</text>
    </g>
  </g>

  <!-- Left Foreground Main Content (Prominent & High Contrast) -->
  <g transform="translate(70, 75)">
    <!-- Top Pill / Status Badge -->
    <g>
      <rect width="320" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle class="live-dot" cx="16" cy="15" r="4.5" fill="#34d399" />
      <text class="body-text" x="29" y="19" font-size="11.5" fill="#cbd5e1" font-weight="600">ENTERPRISE RECONCILIATION ECOSYSTEM</text>
    </g>

    <!-- Main Title (Gradient Fill, Crisp) -->
    <text class="title-text" x="0" y="80" font-size="34" fill="url(#title-grad)" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.8))">
      Automated Intercompany
    </text>
    <text class="title-text" x="0" y="122" font-size="34" fill="#ffffff" filter="drop-shadow(0px 2px 8px rgba(0,0,0,0.8))">
      Reconciliation Engines 🚀
    </text>

    <!-- Subtitle -->
    <text class="body-text" x="0" y="160" font-size="15.5" fill="#94a3b8" font-weight="400">
      Curated directory of SaaS leaders, multi-entity netting systems &amp; open-source matching platforms.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g>
        <rect width="135" height="28" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <text class="body-text" x="12" y="18" font-size="11" fill="#7dd3fc" font-weight="600">⚡ Rule Matching</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="145" height="28" rx="8" fill="#1e293b" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
        <text class="body-text" x="12" y="18" font-size="11" fill="#d8b4fe" font-weight="600">🤖 Agentic AI Triage</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect width="140" height="28" rx="8" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
        <text class="body-text" x="12" y="18" font-size="11" fill="#6ee7b7" font-weight="600">🌐 ERP Integration</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(450, 0)">
        <rect width="150" height="28" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1" />
        <text class="body-text" x="12" y="18" font-size="11" fill="#fcd34d" font-weight="600">🔒 Audit Eliminations</text>
      </g>
    </g>
  </g>
</svg>
